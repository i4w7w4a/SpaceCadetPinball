name: Сборка браузерной версии

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64

      - name: Восстановить игровые ресурсы из закреплённой web-сборки
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/alula/SpaceCadetPinball/a93547299a2ed7bd602630c0be3a43648e25a886/SpaceCadetPinball.js \
            --output "$RUNNER_TEMP/SpaceCadetPinball.js"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/alula/SpaceCadetPinball/a93547299a2ed7bd602630c0be3a43648e25a886/SpaceCadetPinball.data \
            --output "$RUNNER_TEMP/SpaceCadetPinball.data"
          printf '%s  %s\n' \
            '53eea8defa123fc74d602fb89fea87afdaedd93ab8d106f46c75130ce5afd902' \
            "$RUNNER_TEMP/SpaceCadetPinball.data" | sha256sum --check
          node .github/scripts/unpack-web-resources.mjs \
            "$RUNNER_TEMP/SpaceCadetPinball.js" \
            "$RUNNER_TEMP/SpaceCadetPinball.data" \
            game_resources

      - name: Собрать Space Cadet для браузера
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Сохранить готовую игру
        uses: actions/upload-artifact@v4
        with:
          name: ruromans-space-cadet
          path: |
            bin/SpaceCadetPinball.html
            bin/SpaceCadetPinball.js
            bin/SpaceCadetPinball.wasm
            bin/SpaceCadetPinball.data
          if-no-files-found: error
